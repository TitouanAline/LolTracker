spring.application.name=backend

server.port=${PORT:8080}

spring.datasource.url=${LOL_TRACKER_DB_URL}
spring.datasource.username=${LOL_TRACKER_DB_USERNAME}
spring.datasource.password=${LOL_TRACKER_DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require

spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

riot.api.key=${LOL_TRACKER_RIOT_API_KEY}

jwt.secret=${LOL_TRACKER_PASSWORD_ENCODING_KEY}